[package]
name = "appview-rs"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A small, self-hostable ATProto AppView"

[lib]
name = "appview_rs"
path = "src/lib.rs"

[[bin]]
name = "appview-rs"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
rusqlite = { version = "0.37", features = ["bundled", "trace"] }
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
atrium-repo = "0.1.8"
atrium-crypto = "0.1.3"
atrium-api = { version = "0.25.8", default-features = false, features = ["bluesky"] }
ipld-core = { version = "0.4.1", features = ["serde"] }
serde_ipld_dagcbor = { version = "0.6", features = ["std"] }
time = { version = "0.3", features = ["parsing", "formatting"] }
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs", "time", "sync"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
thiserror = "2"
atrium-oauth = { version = "0.1.7", default-features = false }
atrium-xrpc = "0.12.4"
jose-jwk = "0.1.2"
p256 = "0.13.2"
rand = "0.8"
hmac = "0.12"
hkdf = "0.12.4"
sha2 = "0.10"
atrium-identity = "0.1.9"
atrium-common = "0.1.4"
url = "2"
http = "1"
http-body-util = "0.1"
tower-http = { version = "0.6", features = ["limit", "compression-gzip", "compression-br"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
